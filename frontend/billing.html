<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Billing & Payments — MediTrack</title><link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>window.Chart || document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"><\/script>');</script></head>
<body><div class="layout"><nav class="sidebar" id="sidebar"></nav>
<main class="main">
  <div class="page-head"><h1>🧾 Billing &amp; Payments</h1>
    <p>View invoices, track payment status and pay securely — every charge from consultations, labs,
       medicines and emergency care in one place.</p></div>

  <div class="grid g3" id="stats"><div class="skel-row"></div></div>

  <div class="chart-card" style="margin:16px 0">
    <h3>💳 Payment History</h3>
    <div class="chart-wrap sm"><canvas id="chartRevenue"></canvas></div>
  </div>

  <div class="card">
    <div class="actions" style="margin-top:0;justify-content:space-between">
      <h2 style="margin:0">Your Invoices</h2>
      <button class="btn green" id="newBillBtn">＋ Generate Test Invoice</button>
    </div>
    <div id="list"><div class="skel-row"></div><div class="skel-row"></div></div>
  </div>
</main></div>

<!-- Invoice / Pay modal -->
<div class="modal" id="modalOverlay">
  <div class="box" id="invoiceModal" style="max-width:640px"></div>
</div>

<script src="js/api.js"></script><script src="js/app.js"></script>
<script>
buildShell("billing.html");
const pid = guard();
let bills = [];
let revChart;

function closeModal() { document.getElementById("modalOverlay").classList.remove("open"); }
document.getElementById("modalOverlay").addEventListener("click", (e) => {
  if (e.target.id === "modalOverlay") closeModal();
});

function statusChip(s) {
  const map = { Paid: "green", Pending: "grey", "Partially Paid": "blue", Failed: "red", Refunded: "red" };
  return `<span class="badge ${map[s] || "grey"}">${s}</span>`;
}

function renderList() {
  document.getElementById("list").innerHTML = bills.length
    ? `<div class="table-wrap"><table><thead><tr><th>Invoice #</th><th>Date</th><th>Doctor</th>
        <th>Total</th><th>Paid</th><th>Balance</th><th>Status</th><th></th></tr></thead><tbody>` +
      bills.map(b => `<tr>
        <td><b>${esc(b.invoice_number)}</b></td><td>${fmtDate(b.invoice_date)}</td>
        <td>${dash(b.doctor_name)}</td><td>₹${b.total_amount.toLocaleString("en-IN")}</td>
        <td>₹${b.amount_paid.toLocaleString("en-IN")}</td><td>₹${b.balance.toLocaleString("en-IN")}</td>
        <td>${statusChip(b.status)}</td>
        <td><button class="btn sm ghost" onclick="viewInvoice(${b.id})">View</button></td></tr>`).join("")
      + `</tbody></table></div>`
    : `<div class="empty">No invoices yet.<div class="muted" style="margin-top:6px">Invoices appear automatically after a consultation, lab test, or emergency visit.</div></div>`;
}

async function loadStats() {
  const total = bills.reduce((s, b) => s + b.total_amount, 0);
  const paid = bills.reduce((s, b) => s + b.amount_paid, 0);
  const pending = bills.filter(b => b.status !== "Paid").length;
  document.getElementById("stats").innerHTML = `
    <div class="stat"><div class="v">₹${total.toLocaleString("en-IN")}</div><div class="l">Total Billed</div></div>
    <div class="stat green"><div class="v">₹${paid.toLocaleString("en-IN")}</div><div class="l">Total Paid</div></div>
    <div class="stat ${pending ? "" : "green"}"><div class="v">${pending}</div><div class="l">Pending Invoices</div></div>`;
}

async function loadRevenueChart() {
  try {
    const r = await api.get(`/dashboard/billing?patient_id=${pid}`);
    if (revChart) revChart.destroy();
    if (!r.values.some(v => v > 0)) {
      document.querySelector("#chartRevenue").parentElement.innerHTML = `<div class="empty" style="padding:50px 10px">No payments made yet.</div>`;
      return;
    }
    revChart = new Chart(document.getElementById("chartRevenue"), {
      type: "bar",
      data: { labels: r.labels, datasets: [{ label: "Amount Paid (₹)", data: r.values,
        backgroundColor: "#12a37a", borderRadius: 5 }] },
      options: { responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: { y: { beginAtZero: true } } }
    });
  } catch (e) { /* non-critical widget */ }
}

async function viewInvoice(id) {
  const b = await api.get(`/bills/${id}`);
  const balance = b.balance;
  document.getElementById("invoiceModal").innerHTML = `
    <div class="modal-head"><h2>Invoice ${esc(b.invoice_number)}</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="invoice" id="printArea">
      <div class="invoice-top">
        <div><div class="brand" style="color:var(--blue-dark)"><span class="logo">M+</span> MediTrack</div>
          <div class="muted">Integrated Patient Care Management System</div></div>
        <div style="text-align:right">
          <div><b>Invoice #</b> ${esc(b.invoice_number)}</div>
          <div><b>Date</b> ${fmtDate(b.invoice_date)}</div>
          <div>${statusChip(b.status)}</div>
        </div>
      </div>
      <div class="invoice-meta">
        <div><b>Billed To</b><br>${esc(b.patient_name)}<br>Patient ID: ${esc(Session.patientCode)}</div>
        <div><b>Doctor</b><br>${dash(b.doctor_name)}</div>
      </div>
      <table class="invoice-table"><thead><tr><th>Description</th><th>Category</th><th>Qty</th><th>Unit Price</th><th>Amount</th></tr></thead>
        <tbody>${b.items.map(i => `<tr><td>${esc(i.description)}</td><td>${esc(i.category)}</td>
          <td>${i.quantity}</td><td>₹${i.unit_price.toLocaleString("en-IN")}</td><td>₹${i.amount.toLocaleString("en-IN")}</td></tr>`).join("")}</tbody></table>
      <div class="invoice-totals">
        <div><span>Subtotal</span><span>₹${b.subtotal.toLocaleString("en-IN")}</span></div>
        <div><span>Discount</span><span>-₹${b.discount.toLocaleString("en-IN")}</span></div>
        <div><span>Tax</span><span>₹${b.tax.toLocaleString("en-IN")}</span></div>
        <div class="total"><span>Total</span><span>₹${b.total_amount.toLocaleString("en-IN")}</span></div>
        <div><span>Amount Paid</span><span>₹${b.amount_paid.toLocaleString("en-IN")}</span></div>
        <div class="total" style="color:${balance > 0 ? "var(--red)" : "var(--green)"}"><span>Balance Due</span><span>₹${balance.toLocaleString("en-IN")}</span></div>
      </div>
    </div>
    <div class="actions no-print" style="justify-content:flex-end">
      <button class="btn ghost" onclick="window.print()">🖨️ Print / Download</button>
      ${balance > 0 ? `<button class="btn green" onclick="payNow(${b.id}, ${balance})">💳 Pay ₹${balance.toLocaleString("en-IN")}</button>` : ""}
    </div>
    <div id="payArea"></div>`;
  document.getElementById("modalOverlay").classList.add("open");
}

function payNow(billId, balance) {
  document.getElementById("payArea").innerHTML = `
    <div class="card no-print" style="margin-top:14px">
      <h2>Complete Payment</h2>
      <div class="form-grid" style="grid-template-columns:1fr 1fr;gap:12px">
        <div><label>Amount (₹)</label><input id="payAmount" type="number" value="${balance}" max="${balance}" min="1"></div>
        <div><label>Payment Method</label>
          <select id="payMethod"><option>UPI</option><option>Card</option><option>Net Banking</option><option>Cash</option><option>Online</option></select>
        </div>
      </div>
      <button class="btn green" id="confirmPayBtn" onclick="confirmPay(${billId})">Confirm Payment</button>
      <div class="muted" style="margin-top:8px">🔒 Payments are verified securely on the backend. Raw card details are never stored.</div>
    </div>`;
}

async function confirmPay(billId) {
  const amount = parseFloat(document.getElementById("payAmount").value);
  const method = document.getElementById("payMethod").value;
  const btn = document.getElementById("confirmPayBtn");
  btn.disabled = true; btn.textContent = "Processing…";
  try {
    await api.post("/payments", { bill_id: billId, amount, method });
    toast("Payment successful ✅");
    closeModal();
    await load();
  } catch (e) {
    toast(e.message || "Payment failed", "bad");
    btn.disabled = false; btn.textContent = "Confirm Payment";
  }
}

document.getElementById("newBillBtn").onclick = async () => {
  if (!confirm("Generate a sample consultation invoice for testing the billing flow?")) return;
  try {
    await api.post("/bills", {
      patient_id: pid,
      items: [
        { description: "General Consultation", category: "Consultation", quantity: 1, unit_price: 500 },
        { description: "Basic Health Checkup Package", category: "Lab", quantity: 1, unit_price: 800 },
      ],
      discount: 50, tax_percent: 5,
      notes: "Auto-generated sample invoice",
    });
    toast("Invoice generated");
    await load();
  } catch (e) { toast(e.message, "bad"); }
};

async function load() {
  try {
    bills = await api.get(`/patients/${pid}/bills`);
    renderList(); loadStats(); loadRevenueChart();
    const wanted = new URLSearchParams(location.search).get("bill");
    if (wanted && bills.some(b => String(b.id) === wanted)) viewInvoice(Number(wanted));
  } catch (e) {
    document.getElementById("list").innerHTML = "";
    document.getElementById("list").appendChild(errorState(e.message, load));
  }
}
load();
</script>
</body></html>
