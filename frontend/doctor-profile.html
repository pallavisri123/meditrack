<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Doctor Profile — MediTrack</title><link rel="stylesheet" href="css/style.css"></head>
<body><div class="layout"><nav class="sidebar" id="sidebar"></nav>
<main class="main">
  <div class="page-head"><h1>Doctor Profile</h1><p>Full details and live slot availability.</p></div>
  <div class="card" id="doc"></div>
  <div class="card"><h2>📅 Availability</h2><div id="slots"></div>
    <div class="actions"><a class="btn ghost" href="doctors.html">⬅ Back to directory</a>
      <a class="btn ghost" href="dashboard.html">Dashboard</a></div></div>
</main></div>
<script src="js/api.js"></script><script src="js/app.js"></script>
<script>
buildShell("doctors.html"); guard();
const id = new URLSearchParams(location.search).get("id");
(async () => {
  if (!id) { location.href = "doctors.html"; return; }
  const d = await api.get(`/doctors/${id}`);
  document.getElementById("doc").innerHTML = `
    <div style="display:flex;gap:20px;flex-wrap:wrap;align-items:center">
      <div class="avatar" style="display:grid;place-items:center;font-size:34px">🩺</div>
      <div style="flex:1;min-width:240px">
        <h2 style="font-size:22px">${esc(d.name)}</h2>
        <div class="muted">${esc(d.specialization)} • ${esc(d.qualification)}</div>
        <p class="muted" style="margin-top:8px">${esc(d.bio)}</p>
      </div>
      <div class="grid g4" style="min-width:280px">
        <div class="stat"><div class="v">${d.experience_years}</div><div class="l">Years exp</div></div>
        <div class="stat green"><div class="v">₹${d.consultation_fee}</div><div class="l">Fee</div></div>
        <div class="stat"><div class="v">${d.rating}</div><div class="l">Rating</div></div>
      </div>
    </div>
    <div class="actions"><a class="btn green" href="book.html?doctor_id=${d.id}">Book appointment</a>
      <span class="badge blue" style="align-self:center">${esc(d.department)}</span></div>`;
  const av = await api.get(`/doctors/${id}/availability`);
  document.getElementById("slots").innerHTML = av.length ? av.map(day => `
    <div style="margin-bottom:14px"><b>${fmtDate(day.date)}</b> <span class="muted">(${esc(day.day)})</span>
      <div class="chips" style="margin-top:7px">${day.slots.map(s =>
        `<span class="chip ${s.booked ? "booked" : ""}">${esc(s.time)} ${s.booked ? "• Booked" : "• Available"}</span>`).join("")}</div>
    </div>`).join("") : `<div class="empty">No slots published.</div>`;
})();
</script></body></html>
