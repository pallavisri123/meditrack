<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Medical History — MediTrack</title><link rel="stylesheet" href="css/style.css"></head>
<body><div class="layout"><nav class="sidebar" id="sidebar"></nav>
<main class="main">
  <div class="page-head"><h1>Medical History</h1>
    <p>Every appointment, consultation, diagnosis, treatment, prescription and follow-up on one health timeline.</p></div>

  <div class="grid g4" id="stats"></div>

  <div class="grid g2" style="margin-top:18px">
    <div class="card"><h2>🧬 Health Timeline</h2>
      <div class="search-row"><select id="ft" onchange="renderTl()">
        <option value="">All events</option><option>Registration</option><option>Appointment</option>
        <option>Consultation</option><option>Prescription</option><option>Emergency</option></select></div>
      <div id="tl"></div></div>
    <div>
      <div class="card"><h2>🩺 Diagnoses &amp; treatments</h2><div id="dx"></div></div>
      <div class="card"><h2>💊 Prescriptions</h2><div id="rx"></div></div>
      <div class="card"><h2>📅 Follow-ups</h2><div id="fu"></div></div>
    </div>
  </div>
  <div class="card"><div class="actions"><a class="btn ghost" href="dashboard.html">⬅ Dashboard</a>
    <button class="btn" onclick="window.print()">🖨 Print history</button></div></div>
</main></div>
<script src="js/api.js"></script><script src="js/app.js"></script>
<script>
buildShell("history.html");
const pid = guard(); let events = [];
function renderTl() {
  const f = document.getElementById("ft").value;
  const list = events.filter(e => !f || e.event_type === f);
  document.getElementById("tl").innerHTML = list.length
    ? `<div class="timeline">` + list.map(e => `<div class="tl-item ${esc(e.event_type)}">
        <h4>${esc(e.title)}</h4><div class="muted">${dash(e.detail)}</div>
        <div class="when">${esc(e.event_type)} • ${esc(e.event_date)}</div></div>`).join("") + `</div>`
    : `<div class="empty">No events yet.</div>`;
}
(async () => {
  const [hist, appts, cons, rxs] = await Promise.all([
    api.get(`/patients/${pid}/history`),
    api.get(`/appointments?patient_id=${pid}`),
    api.get(`/consultations?patient_id=${pid}`),
    api.get(`/prescriptions?patient_id=${pid}`),
  ]);
  events = hist; renderTl();
  document.getElementById("stats").innerHTML = `
    <div class="stat"><div class="v">${appts.length}</div><div class="l">Appointments</div></div>
    <div class="stat green"><div class="v">${cons.length}</div><div class="l">Consultations</div></div>
    <div class="stat green"><div class="v">${rxs.length}</div><div class="l">Prescriptions</div></div>
    <div class="stat"><div class="v">${events.length}</div><div class="l">Timeline events</div></div>`;
  document.getElementById("dx").innerHTML = cons.length
    ? cons.map(c => `<div style="padding:9px 0;border-bottom:1px solid var(--line)">
        <b>${dash(c.diagnosis)}</b> <span class="badge blue">${fmtDate(c.consultation_date)}</span>
        <div class="muted">Treatment: ${dash(c.treatment)} • ${esc(c.doctor_name)}</div></div>`).join("")
    : `<div class="empty">No diagnoses recorded.</div>`;
  document.getElementById("rx").innerHTML = rxs.length
    ? rxs.map(p => `<div style="padding:9px 0;border-bottom:1px solid var(--line)">
        <b>${esc(p.prescription_code)}</b> — ${p.medicines.map(m => esc(m.medicine)).join(", ")}
        <div class="muted">${esc(p.doctor_name)} • ${esc(p.created_at)}
        <a href="prescriptions.html?id=${p.id}">view</a></div></div>`).join("")
    : `<div class="empty">No prescriptions.</div>`;
  const fu = cons.filter(c => c.followup_date);
  document.getElementById("fu").innerHTML = fu.length
    ? fu.map(c => `<div style="padding:8px 0"><span class="badge green">${fmtDate(c.followup_date)}</span>
        with ${esc(c.doctor_name)}</div>`).join("")
    : `<div class="empty">No follow-ups scheduled.</div>`;
})();
</script></body></html>
