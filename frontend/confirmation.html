<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Appointment Confirmed — MediTrack</title><link rel="stylesheet" href="css/style.css"></head>
<body><div class="layout"><nav class="sidebar" id="sidebar"></nav>
<main class="main">
  <div class="page-head"><h1>Appointment Confirmation</h1><p>Your slot is locked in the hospital database.</p></div>
  <div class="card" id="box"></div>
</main></div>
<script src="js/api.js"></script><script src="js/app.js"></script>
<script>
buildShell("appointments.html");
const pid = guard();
const id = new URLSearchParams(location.search).get("id");
(async () => {
  const list = await api.get(`/appointments?patient_id=${pid}`);
  const a = list.find(x => String(x.id) === String(id));
  if (!a) { document.getElementById("box").innerHTML = `<div class="empty">Appointment not found.</div>`; return; }
  document.getElementById("box").innerHTML = `
    <div style="text-align:center;padding:8px 0 18px">
      <div style="font-size:46px">✅</div>
      <h2 style="justify-content:center;font-size:20px">Appointment ${esc(a.appointment_code)} confirmed</h2>
      <p class="muted">A reminder notification has been added to your dashboard.</p>
    </div>
    <div class="grid g3">
      <div class="stat"><div class="l">Doctor</div><div class="v" style="font-size:17px">${esc(a.doctor_name)}</div></div>
      <div class="stat"><div class="l">Department</div><div class="v" style="font-size:17px">${esc(a.department)}</div></div>
      <div class="stat green"><div class="l">Date &amp; time</div><div class="v" style="font-size:17px">${fmtDate(a.slot_date)} · ${esc(a.slot_time)}</div></div>
      <div class="stat green"><div class="l">Consultation fee</div><div class="v" style="font-size:17px">₹${a.fee}</div></div>
      <div class="stat"><div class="l">Status</div><div class="v" style="font-size:17px">${esc(a.status)}</div></div>
    </div>
    <p class="muted" style="margin-top:14px">Reason: ${dash(a.reason)}</p>
    <div class="actions">
      <a class="btn" href="appointments.html">📋 My appointments</a>
      <a class="btn green" href="consultations.html?appointment_id=${a.id}">💬 Go to consultation</a>
      <a class="btn ghost" href="dashboard.html">⬅ Dashboard</a>
      <button class="btn ghost" onclick="window.print()">🖨 Print</button>
    </div>`;
})();
</script></body></html>
