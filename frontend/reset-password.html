<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password — MediTrack</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-side">
    <div class="logo-big">M+</div>
    <h1>Choose a new password.</h1>
    <p>Pick a strong password you haven't used before. Your reset link is single-use and expires
       automatically for your account's security.</p>
  </div>
  <div class="auth-form-wrap">
    <div class="auth-card">
      <h2>Set a new password</h2>
      <div class="step-flow">
        <span class="done">1. Enter email</span><span class="active">2. Reset password</span><span>3. Login</span>
      </div>
      <div class="sub" id="subline">Enter and confirm your new password below.</div>
      <div id="alertBox"></div>

      <form id="resetForm" novalidate>
        <div class="auth-field">
          <label>New Password</label>
          <div class="pw-wrap">
            <input type="password" id="new_password" autocomplete="new-password" placeholder="Enter new password">
            <button type="button" class="pw-toggle" id="pwToggle">👁</button>
          </div>
          <div class="pw-strength"><span id="b1"></span><span id="b2"></span><span id="b3"></span><span id="b4"></span></div>
          <span class="err" id="err_new_password"></span>
        </div>
        <div class="auth-field">
          <label>Confirm New Password</label>
          <div class="pw-wrap">
            <input type="password" id="confirm_password" autocomplete="new-password" placeholder="Re-enter new password">
            <button type="button" class="pw-toggle" id="pwToggle2">👁</button>
          </div>
          <span class="err" id="err_confirm_password"></span>
        </div>
        <button type="submit" class="auth-submit" id="submitBtn">Update Password</button>
      </form>

      <div class="auth-foot"><a href="login.html">← Back to login</a></div>
    </div>
  </div>
</div>
<script src="js/api.js"></script>
<script>
const params = new URLSearchParams(location.search);
const token = params.get("token");
if (!token) {
  document.getElementById("resetForm").style.display = "none";
  document.getElementById("alertBox").innerHTML =
    `<div class="alert bad">This reset link is missing or invalid. Please request a new one from
     <a href="forgot-password.html">Forgot Password</a>.</div>`;
}

function showAlert(msg, type) { document.getElementById("alertBox").innerHTML = `<div class="alert ${type}">${msg}</div>`; }
function setErr(id, msg) { document.getElementById("err_" + id).textContent = msg || ""; }

["pwToggle", "pwToggle2"].forEach((id, i) => {
  document.getElementById(id).onclick = () => {
    const f = document.getElementById(i === 0 ? "new_password" : "confirm_password");
    f.type = f.type === "password" ? "text" : "password";
  };
});
document.getElementById("new_password").addEventListener("input", (e) => {
  const v = e.target.value;
  const checks = [v.length >= 8, /[A-Z]/.test(v), /[0-9]/.test(v), /[^A-Za-z0-9]/.test(v)];
  const score = checks.filter(Boolean).length;
  ["b1", "b2", "b3", "b4"].forEach((id, i) => {
    const el = document.getElementById(id);
    el.className = i < score ? `on${score}` : "";
  });
});

document.getElementById("resetForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  setErr("new_password", ""); setErr("confirm_password", "");
  const pw = document.getElementById("new_password").value;
  const cpw = document.getElementById("confirm_password").value;
  let ok = true;
  if (pw.length < 8 || !/[A-Z]/.test(pw) || !/[a-z]/.test(pw) || !/[0-9]/.test(pw) || !/[^A-Za-z0-9]/.test(pw)) {
    setErr("new_password", "Min 8 characters, with upper, lower, number & symbol"); ok = false;
  }
  if (pw !== cpw) { setErr("confirm_password", "Passwords do not match"); ok = false; }
  if (!ok) return;

  const btn = document.getElementById("submitBtn");
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner"></span> Updating…`;
  try {
    await api.post("/auth/reset-password", { token, new_password: pw, confirm_password: cpw });
    showAlert("Password updated successfully. Redirecting to login…", "ok");
    setTimeout(() => location.href = "login.html?reset=1", 900);
  } catch (err) {
    showAlert(err.message || "This reset link is invalid or has expired.", "bad");
    btn.disabled = false;
    btn.textContent = "Update Password";
  }
});
</script>
</body>
</html>
